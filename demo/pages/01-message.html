<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account notice</title>
    <style>
      body { margin: 0; background: #f3f6f5; color: #182321; font: 16px/1.6 Arial, sans-serif; }
      main { max-width: 680px; margin: 12vh auto; padding: 40px; background: #fff; border-top: 5px solid #0f766e; }
      h1 { margin: 0 0 20px; font-size: 28px; }
      p { margin: 12px 0; }
      @media (max-width: 720px) { main { margin: 0; padding: 28px 20px; min-height: 100vh; box-sizing: border-box; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Account notice</h1>
      <p>http://notice.example.test urgent action required</p>
    </main>
  </body>
</html>
